    const info = describeEvent(ev);
    return `<div class="ev-row ${info.cat}">
      <div class="ev-top"><span>${escapeHtml(ev.name)}</span><span class="ev-tick">t${ev.tick}</span></div>
      <div class="ev-desc">${escapeHtml(info.text)}</div>
    </div>`;
  }).join("");
  if (eventListEl.dataset.sig !== evHtml) {
    eventListEl.dataset.sig = evHtml;
    eventListEl.innerHTML = evHtml || `<div style="color:var(--muted);padding:6px;">Chưa có sự kiện nào.</div>`;
  }

  // Mode-specific HUD (tách riêng top / bottom / modal để không giật tooltip khi di chuyển)
  const lowTime = (snap.time_left_ticks ?? 9999) <= 1800 && !snap.finished;

  if (snap.mode === "gather") {
    const p = snap.player || {};
    const meta = snap.meta || {};
    const nodes = snap.nodes || [];
    const readyNodes = nodes.filter((n) => n.ready !== false).length;
    const fishCount = (snap.fish || []).length;
    const posRounded = p.pos ? [p.pos[0].toFixed(1), p.pos[1].toFixed(1)] : null;
    const speedStr = p.vel ? Math.hypot(p.vel[0] || 0, p.vel[1] || 0).toFixed(1) : null;
    const hasExtraGather = nodes.some((n) => EXTRA_KINDS.has(n.kind)) ||
      (snap.fish || []).some((f) => EXTRA_KINDS.has(f.kind)) ||
      Boolean(meta.fish_yield && Object.keys(meta.fish_yield).some((k) => EXTRA_KINDS.has(k)));
    const topKey = JSON.stringify([
      "gather", Math.ceil((snap.time_left_ticks || 0) / 60), lowTime, hasExtraGather,
      Math.round((p.oxygen_ticks ?? 0) / 3), p.oxygen_max_ticks, p.at_surface,
      p.zero_oxy_ticks, p.hp, p.hp_max, p.invuln_ticks > 0,
      Math.ceil((p.catch_cd_ticks || 0) / 6), readyNodes, nodes.length, fishCount, posRounded, speedStr
    ]);
    if (topKey !== lastTopKey) {
      lastTopKey = topKey;
      const oxy = p.oxygen_ticks ?? 0;
      const oxyMax = p.oxygen_max_ticks || Math.round((meta.oxygen_max_s || 30) * 60);
      const oxyPct = oxyMax > 0 ? Math.max(0, Math.min(100, (oxy / oxyMax) * 100)) : 0;
      const oxyCol = oxyPct < 25 ? "#ef5350" : oxyPct < 50 ? "#ffa726" : "#4fc3f7";
      const atSurf = p.at_surface !== undefined ? p.at_surface : ((p.pos ? p.pos[1] : 0) <= (meta.surface_depth ?? 0.5));
      const zeroOxy = p.zero_oxy_ticks || 0;
      const chokeMax = meta.choke_interval_ticks || 60;
      const chokePct = Math.min(100, (zeroOxy / chokeMax) * 100);
      const hp = p.hp ?? meta.hp_max ?? 3;
      const hpMax = p.hp_max ?? meta.hp_max ?? 3;

      let heartsHtml = "";
      for (let i = 0; i < hpMax; i++) {
        heartsHtml += `<span class="${i < hp ? "heart-on" : "heart-off"}">${i < hp ? "♥" : "♡"}</span>`;
      }

      topLeftEl.innerHTML = `
        <span class="badge gather">🌊 Buổi sáng · Lặn & Hái</span>
        ${hasExtraGather ? `<span class="badge ok">✨ Mở rộng</span>` : ""}
        <span class="clock ${lowTime ? "low" : ""}">⏱ ${fmtTime(snap.time_left_ticks)}</span>
        <div class="oxy-wrap">
          <div class="oxy-head">
            <span><b>Oxy</b> ${(oxy / 60).toFixed(1)}s / ${Math.round(oxyMax / 60)}s</span>
            <span class="badge ${oxy <= 0 && !atSurf ? "danger" : atSurf ? "ok" : ""}" style="padding:1px 6px;font-size:10px;">
              ${oxy <= 0 && !atSurf ? "NGẠT!" : atSurf ? "Mặt nước · Hồi" : "Dưới nước"}
            </span>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${oxyPct.toFixed(1)}%;background:${oxyCol};"></div></div>
          ${zeroOxy > 0 ? `<div class="choke-track" title="Đếm ngạt trước khi mất 1 Máu"><div class="choke-fill" style="width:${chokePct.toFixed(1)}%;"></div></div>` : ""}
        </div>
        <div class="hearts" title="Máu (${hp}/${hpMax})">${heartsHtml}<span class="heart-num">${hp}/${hpMax}</span></div>
      `;

      const posStr = posRounded ? `x:${posRounded[0]} d:${posRounded[1]}m${speedStr !== null ? " · v:" + speedStr : ""}` : "";
      const cd = p.catch_cd_ticks || 0;
      topCenterEl.innerHTML = `
        <span class="chip">🌿 Nút sẵn sàng: <b>${readyNodes}/${nodes.length}</b></span>
        <span class="chip">🐟 Đàn cá: <b>${fishCount}</b></span>
        <span class="chip">${posStr}</span>
        ${cd > 0 ? `<span class="badge warn">Hồi chiêu bắt ${(cd / 60).toFixed(1)}s</span>` : ""}
        ${(p.invuln_ticks || 0) > 0 ? `<span class="badge ok">Miễn sát thương</span>` : ""}
      `;
    }

    // Bottom: Giỏ hàng LIFO + tổng hợp nguyên liệu
    const hold = snap.hold || [];
    const holdCount = snap.hold_count ?? hold.length;
    const cap = snap.hold_capacity || meta.hold_capacity || 12;
    const bottomKey = JSON.stringify(["gather", hold, holdCount, cap]);
    if (bottomKey !== lastBottomKey) {
      lastBottomKey = bottomKey;
      const isFull = holdCount >= cap;
      let slotsHtml = "";
      for (let i = 0; i < cap; i++) {
        const item = hold[i];
        const isTop = item && i === hold.length - 1;
        if (item) {
          const km = kindMeta(item);
          slotsHtml += `<div class="slot filled ${isTop ? "top-lifo" : ""}" title="#${i + 1}: ${km.name}${isTop ? " (Đỉnh LIFO - mới nhất)" : ""}" style="background:${km.color}2e;border-color:${km.color};">
            <span class="slot-dot" style="background:${km.color};"></span>
          </div>`;
        } else {
          slotsHtml += `<div class="slot" title="Ô trống #${i + 1}"></div>`;
        }
      }
      const counts = {};
      for (const k of hold) counts[k] = (counts[k] || 0) + 1;
      const summaryChips = Object.keys(counts).sort().map((k) => {
        const km = kindMeta(k);
        return `<span class="chip"><span class="chip-swatch" style="background:${km.color};"></span>${km.name} <b>×${counts[k]}</b></span>`;
      }).join("");

      bottomLeftEl.innerHTML = `
        <div class="hold-section">
          <div class="hold-header">
            <span><b>Giỏ hàng (LIFO):</b> ${holdCount}/${cap}</span>
            ${isFull ? `<span class="badge danger">ĐẦY GIỎ · VỀ BẾN (E)</span>` : `<span class="chip-sub">Đáy → Đỉnh (viền vàng = mới nhất)</span>`}
            <div class="chips">${summaryChips || `<span class="chip-sub">(Giỏ đang trống)</span>`}</div>
          </div>
          <div class="hold-slots">${slotsHtml}</div>
        </div>
      `;
      bottomRightEl.innerHTML = `
        <span><kbd>WASD</kbd>/<kbd>↑↓←→</kbd> Bơi</span>
        <span><kbd>E</kbd> Hái / Cập bến</span>
        <span><kbd>Space</kbd> Bắt cá</span>
        <span><kbd>R</kbd> Chơi lại</span>
      `;
    }
  } else {
    // QUAN mode HUD
    const meta = snap.meta || {};
    const handDish = extractDishId(snap.hand);
    const stoves = snap.stoves || [];
    const customers = snap.customers || [];
    const readyStoves = stoves.filter((s) => s.state === "ready").length;
    const cookingStoves = stoves.filter((s) => s.state === "cooking").length;

    const topKey = JSON.stringify([
      "quan", Math.ceil((snap.time_left_ticks || 0) / 60), lowTime,
      snap.money, snap.earned, snap.reputation, snap.score,
      handDish, stoves.length, readyStoves, cookingStoves, customers.length, (snap.tables || []).length
    ]);
    if (topKey !== lastTopKey) {
      lastTopKey = topKey;
      const handInfo = handDish ? dishMeta(handDish) : null;
      topLeftEl.innerHTML = `
        <span class="badge quan">🏮 Buổi tối · Mở Quán</span>
        <span class="clock ${lowTime ? "low" : ""}">⏱ ${fmtTime(snap.time_left_ticks)}</span>
        <div class="stat-card">
          <span class="stat-label">Tiền / Thu nhập</span>
          <span class="stat-val gold">${snap.money ?? 0}k <span style="color:var(--muted);font-weight:500;font-size:11px;">(ca: ${snap.earned ?? 0}k)</span></span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Uy tín</span>
          <span class="stat-val stars">${renderStars(snap.reputation, meta.reputation_max || 5)}</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Điểm</span>
          <span class="stat-val green">${snap.score ?? 0}</span>
        </div>
      `;

      topCenterEl.innerHTML = `
        <div class="hand-pill ${handDish ? "carrying" : ""}">
          <span>${handInfo ? handInfo.icon : "✋"}</span>
          <span>${handInfo ? `Trên tay: ${handInfo.name}` : `Tay trống (0/${meta.carry_limit || 1})`}</span>
        </div>
        <span class="chip">🔥 Bếp: <b>${stoves.length}</b> ${readyStoves ? `<span style="color:#a5d6a7;">(${readyStoves} chín!)</span>` : cookingStoves ? `<span style="color:#ffcc80;">(${cookingStoves} đang nấu)</span>` : ""}</span>
        <span class="chip">🪑 Khách: <b>${customers.length}/${(snap.tables || []).length}</b></span>
      `;
    }

    // Bottom: Kho nguyên liệu (kèm số lượng đang giữ chỗ nếu có) + Thực đơn nhanh
    const stock = snap.stock || {};
    const reservedTotals = {};
    for (const c of customers) {
      if (c.reserved && typeof c.reserved === "object") {
        for (const [k, v] of Object.entries(c.reserved)) {
          if (v > 0) reservedTotals[k] = (reservedTotals[k] || 0) + v;
        }
      }
    }
    const hasExtra = Object.keys(stock).some((k) => EXTRA_KINDS.has(k)) ||
      Object.keys(reservedTotals).some((k) => EXTRA_KINDS.has(k)) ||
      EXTRA_MENU_IDS.includes(handDish) ||
      stoves.some((s) => EXTRA_MENU_IDS.includes(extractDishId(s.dish || s.dish_id))) ||
      customers.some((c) => EXTRA_MENU_IDS.includes(extractDishId(c.dish_id || c.dish || c.order)));
    const bottomKey = JSON.stringify(["quan", stock, reservedTotals, hasExtra]);
    if (bottomKey !== lastBottomKey) {
      lastBottomKey = bottomKey;
      const allKinds = Array.from(new Set([...KINDS_ORDER, ...Object.keys(stock), ...Object.keys(reservedTotals)]));
      const stockHtml = allKinds.map((k) => {
        const km = kindMeta(k);
        const qty = stock[k] || 0;
        const res = reservedTotals[k] || 0;
        return `<span class="chip ${qty === 0 && res === 0 ? "zero" : ""}" title="${km.name}: còn ${qty}${res > 0 ? ` (đã giữ chỗ: ${res})` : ""}">
          <span class="chip-swatch" style="background:${km.color};"></span>
          ${km.name} <b>×${qty}</b>${res > 0 ? `<span class="chip-sub">(giữ ${res})</span>` : ""}
        </span>`;
      }).join("");

      const visibleMenuIds = hasExtra ? [...CORE_MENU_IDS, ...EXTRA_MENU_IDS] : CORE_MENU_IDS;
      const menuHtml = visibleMenuIds.map((id) => {
        const m = MENU_INFO[id];
        const ok = canCookDish(id, stock);
        const recStr = Object.entries(m.recipe).map(([rk, rv]) => `${kindMeta(rk).short}×${rv}`).join("+");
        return `<span class="chip ${ok ? "craftable" : "zero"}" title="${m.name} — Nấu ${m.cook_s}s — Giá ${m.price}k">
          <span>${m.icon}</span>
          <span><b>${m.short}</b> ${m.price}k</span>
          <span class="chip-sub">${recStr}</span>
        </span>`;
      }).join("");

      bottomLeftEl.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:5px;width:100%;">
          <div class="chips"><span style="font-weight:700;color:var(--accent);font-size:12px;">Kho:</span>${stockHtml}</div>
          <div class="chips"><span style="font-weight:700;color:var(--muted);font-size:11px;">Thực đơn:</span>${menuHtml}</div>
        </div>
      `;
      bottomRightEl.innerHTML = `
        <span><kbd>WASD</kbd>/<kbd>↑↓←→</kbd> Đi</span>
        <span><kbd>E</kbd> Nấu / Bưng / Phục vụ</span>
        <span><kbd>R</kbd> Chơi lại</span>
      `;
    }
  }

  // Modal tổng kết khi kết thúc buổi
  const modalKey = JSON.stringify([snap.finished, snap.mode, snap.reason, snap.tick, sessionStats]);
  if (modalKey !== lastModalKey) {
    lastModalKey = modalKey;
    if (snap.finished) {
      endModalEl.classList.add("show");
      const isGather = snap.mode === "gather";
      modalTitleEl.textContent = isGather ? "Kết thúc Buổi Sáng (Lặn & Hái)" : "Kết thúc Buổi Tối (Mở Quán)";
      modalSubEl.textContent = REASON_LABEL[snap.reason] || `Lý do: ${snap.reason || "hoàn tất"}`;
      if (isGather) {
        const p = snap.player || {};
        const hold = snap.hold || [];
        const counts = {};
        for (const k of hold) counts[k] = (counts[k] || 0) + 1;
        modalGridEl.innerHTML = `
          <div class="modal-stat"><div class="stat-label">Thời gian còn</div><div class="stat-val">${fmtTime(snap.time_left_ticks)}</div></div>
          <div class="modal-stat"><div class="stat-label">Máu còn lại</div><div class="stat-val">${p.hp ?? 0} / ${p.hp_max ?? 3}</div></div>
          <div class="modal-stat"><div class="stat-label">Tổng hàng mang về</div><div class="stat-val gold">${hold.length} / ${snap.hold_capacity ?? 12}</div></div>
          <div class="modal-stat"><div class="stat-label">Số tick</div><div class="stat-val">${snap.tick ?? 0}</div></div>
        `;
        const invHtml = Object.keys(counts).sort().map((k) => {
          const km = kindMeta(k);
          return `<span class="chip"><span class="chip-swatch" style="background:${km.color};"></span>${km.name} <b>×${counts[k]}</b></span>`;
        }).join("");
        modalExtraEl.innerHTML = `<div class="chips">${invHtml || `<span style="color:var(--muted);">Kho thu hoạch trống.</span>`}</div>`;
      } else {
        modalGridEl.innerHTML = `
          <div class="modal-stat"><div class="stat-label">Thu nhập ca</div><div class="stat-val gold">${snap.earned ?? 0}k</div></div>
          <div class="modal-stat"><div class="stat-label">Điểm tổng</div><div class="stat-val green">${snap.score ?? 0}</div></div>
          <div class="modal-stat"><div class="stat-label">Uy tín cuối ca</div><div class="stat-val stars">${renderStars(snap.reputation, (snap.meta && snap.meta.reputation_max) || 5)}</div></div>
          <div class="modal-stat"><div class="stat-label">Số tick</div><div class="stat-val">${snap.tick ?? 0}</div></div>
        `;
        modalExtraEl.innerHTML = `<div class="chips">
          <span class="chip">✅ Khách đã trả tiền: <b>${sessionStats.paid}</b></span>
          ${sessionStats.tips > 0 ? `<span class="chip">★ Tiền boa: <b>+${sessionStats.tips}k</b></span>` : ""}
          <span class="chip">⚠ Khách bỏ đi: <b>${sessionStats.left}</b></span>
        </div>`;
      }
    } else {
      endModalEl.classList.remove("show");
    }
  }
}

// ---------- Hỗ trợ vẽ Canvas 2D ----------
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function getHudInsets() {
  const top = Math.max(60, hudTopEl.getBoundingClientRect().height + 6);
  const bottom = Math.max(68, hudBottomEl.getBoundingClientRect().height + 6);
  return { top, bottom };
}
function drawText(s, x, y, o = {}) {
  ctx.font = (o.bold ? "700 " : "") + (o.size || 13) + "px system-ui, -apple-system, sans-serif";
  ctx.fillStyle = o.color || "#f3f6f8";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  if (o.shadow) {
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.65)";
    ctx.shadowBlur = 4;
    ctx.fillText(s, x, y);
    ctx.restore();
  } else {
    ctx.fillText(s, x, y);
  }
}
function roundRectPath(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}
function drawPillLabel(text, cx, cy, bg = "rgba(10,20,29,0.82)", fg = "#fff", border = "rgba(255,255,255,0.28)", size = 11) {
  ctx.font = `700 ${size}px system-ui, sans-serif`;
  const tw = ctx.measureText(text).width;
  const pw = tw + 12, ph = size + 8;
  roundRectPath(cx - pw / 2, cy - ph / 2, pw, ph, ph / 2);
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.strokeStyle = border;
  ctx.lineWidth = 1;
  ctx.stroke();
  drawText(text, cx, cy + 1, { size, bold: true, align: "center", base: "middle", color: fg });
}
function drawBar(x, y, w, h, frac, color, markerFrac = null) {
  const f = Math.max(0, Math.min(1, frac));
  roundRectPath(x, y, w, h, h / 2);
  ctx.fillStyle = "rgba(0,0,0,0.58)";
  ctx.fill();
  if (f > 0) {
    roundRectPath(x, y, Math.max(h * 0.5, w * f), h, h / 2);
    ctx.fillStyle = color;
    ctx.fill();
  }
  if (markerFrac !== null && markerFrac > 0 && markerFrac < 1) {
    const mx = x + w * markerFrac;
    ctx.strokeStyle = "#ffd54f";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(mx, y - 1);
    ctx.lineTo(mx, y + h + 1);
    ctx.stroke();
  }
  roundRectPath(x, y, w, h, h / 2);
  ctx.strokeStyle = "rgba(255,255,255,0.45)";
  ctx.lineWidth = 1;
  ctx.stroke();
}

// ---------- Vẽ cảnh GATHER (nhìn ngang: x sang phải, d độ sâu xuống dưới) ----------
function drawGather(w, h, dt) {
  const { top, bottom } = getHudInsets();
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6.2;
  const padX = 24;
  const s = Math.max(2, Math.min((w - padX * 2) / (X + 4), (h - top - bottom - 16) / (D + SKY + 1.5)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s;
  const oy = top + 8 + SKY * s;
  const sx = (x) => ox + x * s;
  const sy = (d) => oy + d * s;

  // 1. Bầu trời bình minh miền Tây
  const skyGrad = ctx.createLinearGradient(0, top, 0, oy);
  skyGrad.addColorStop(0, "#5c9ec4");
  skyGrad.addColorStop(0.55, "#b7dff0");
  skyGrad.addColorStop(1, "#fce5b8");
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, top, w, oy - top);

  // Mặt trời sáng dịu
  const sunX = sx(X * 0.84), sunY = sy(-3.8);
  const sunGlow = ctx.createRadialGradient(sunX, sunY, 2, sunX, sunY, 4.5 * s);
  sunGlow.addColorStop(0, "rgba(255, 245, 196, 0.95)");
  sunGlow.addColorStop(0.4, "rgba(255, 224, 130, 0.45)");
  sunGlow.addColorStop(1, "rgba(255, 224, 130, 0)");
  ctx.fillStyle = sunGlow;
  ctx.beginPath();
  ctx.arc(sunX, sunY, 4.5 * s, 0, Math.PI * 2);
  ctx.fill();

  // Mây trôi nhẹ (thuần trang trí)
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  for (let i = 0; i < 4; i++) {
    const cx = sx(((i * 28 + animTime * 0.45) % (X + 16)) - 8);
    const cy = sy(-4.2 + (i % 2) * 1.1);
    ctx.beginPath();
    ctx.ellipse(cx, cy, 3.2 * s, 0.85 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + 1.6 * s, cy - 0.3 * s, 2.2 * s, 0.7 * s, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Bóng dừa nước xa xa trên bờ
  ctx.fillStyle = "rgba(42, 82, 68, 0.28)";
  for (let x = 10; x < X; x += 14) {
    const bx = sx(x), by = oy;
    ctx.beginPath();
    ctx.moveTo(bx - 4 * s, by);
    ctx.quadraticCurveTo(bx, by - (1.8 + (x % 3) * 0.4) * s, bx + 4 * s, by);
    ctx.fill();
  }

  // 2. Khối nước sông & tia nắng xuyên nước
  const waterGrad = ctx.createLinearGradient(0, oy, 0, sy(D));
  waterGrad.addColorStop(0, "#3db4d6");
  waterGrad.addColorStop(0.22, "#1c7ea1");
  waterGrad.addColorStop(0.65, "#0d4669");
  waterGrad.addColorStop(1, "#07223a");
  ctx.fillStyle = waterGrad;
  ctx.fillRect(sx(0), oy, X * s, D * s);

  // Tia sáng dưới mặt nước
  ctx.save();
  ctx.beginPath();
  ctx.rect(sx(0), oy, X * s, D * s);
  ctx.clip();
  for (let i = 0; i < 6; i++) {
    const rx = sx(10 + i * 16 + Math.sin(animTime * 0.4 + i) * 1.5);
    const rayG = ctx.createLinearGradient(rx, oy, rx + 5 * s, sy(16));
    rayG.addColorStop(0, "rgba(220, 248, 255, 0.14)");
    rayG.addColorStop(1, "rgba(220, 248, 255, 0)");
    ctx.fillStyle = rayG;
    ctx.beginPath();
    ctx.moveTo(rx, oy);
    ctx.lineTo(rx + 4 * s, oy);
    ctx.lineTo(rx + 10 * s, sy(18));
    ctx.lineTo(rx + 2 * s, sy(18));
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // Đáy sông & rong rêu
  ctx.fillStyle = "#3d3326";
  ctx.fillRect(sx(0), sy(D), X * s, 1.3 * s);
  ctx.strokeStyle = "rgba(86, 152, 92, 0.45)";
  ctx.lineWidth = Math.max(1.5, 0.18 * s);
  for (let x = 6; x < X; x += 8) {
    const wx = sx(x), sway = Math.sin(animTime * 1.8 + x) * 0.5 * s;
    ctx.beginPath();
    ctx.moveTo(wx, sy(D));
    ctx.quadraticCurveTo(wx + sway, sy(D - 1.4), wx + sway * 1.4, sy(D - 2.4));
    ctx.stroke();
  }

  // Viền biên nước & vạch độ sâu
  ctx.strokeStyle = "rgba(255,255,255,0.22)";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(sx(0), oy, X * s, D * s);

  // Đường surface_depth (ranh giới mặt nước / dưới nước)
  const surfD = meta.surface_depth ?? 0.5;
  ctx.strokeStyle = "rgba(179, 229, 252, 0.35)";
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(sx(0), sy(surfD));
  ctx.lineTo(sx(X), sy(surfD));
  ctx.stroke();
  ctx.setLineDash([]);

  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sx(0), sy(d));
    ctx.lineTo(sx(X), sy(d));
    ctx.stroke();
    drawText(d + "m", sx(0) + 5, sy(d) - 3, { size: 10, color: "rgba(255,255,255,0.45)" });
  }

  // Mặt nước gợn sóng nhẹ
  ctx.strokeStyle = "#e8f8ff";
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  for (let x = 0; x <= X; x += 2) {
    const wy = oy + Math.sin(animTime * 2.5 + x * 0.35) * Math.min(2, 0.12 * s);
    if (x === 0) ctx.moveTo(sx(x), wy);
    else ctx.lineTo(sx(x), wy);
  }
  ctx.stroke();

  const hint = getGatherHintTarget();

  // 3. Bến chợ nổi (Dock)
  const dp = meta.dock_pos || [2, 0];
  const dr = meta.dock_radius || 3;
  const dockActive = hint && hint.type === "dock";
  if (!sprite("boat", sx(dp[0]), sy(-1.2), 4.6 * s)) {
    // Cọc gỗ dưới nước
    ctx.fillStyle = "#5d432c";
    ctx.fillRect(sx(dp[0] - 1.3), sy(-0.2), 0.3 * s, 3.2 * s);
    ctx.fillRect(sx(dp[0] + 1.0), sy(-0.2), 0.3 * s, 3.2 * s);
    // Sàn bến & chòi mái lá/ngói
    ctx.fillStyle = "#8d633c";
    ctx.fillRect(sx(dp[0] - 1.9), sy(-0.7), 3.8 * s, 0.85 * s);
    ctx.fillStyle = "#a84432";
    ctx.beginPath();
    ctx.moveTo(sx(dp[0] - 2.3), sy(-0.7));
    ctx.lineTo(sx(dp[0]), sy(-2.7));
    ctx.lineTo(sx(dp[0] + 2.3), sy(-0.7));
    ctx.closePath();
    ctx.fill();
    // Đèn lồng nhỏ ở bến
    ctx.fillStyle = "#ffd54f";
    ctx.beginPath();
    ctx.arc(sx(dp[0] + 1.3), sy(-0.9), 0.32 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  // Vòng phạm vi bến
  ctx.strokeStyle = dockActive ? "#ffd54f" : "rgba(255, 224, 130, 0.55)";
  ctx.lineWidth = dockActive ? 2.2 : 1.3;
  ctx.setLineDash([5, 4]);
  ctx.beginPath();
  ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  drawText("Bến Chợ Nổi", sx(dp[0]), sy(-3.1), { size: 11, bold: true, align: "center", color: "#3d2210" });

  // 4. Nút hái trên mặt nước (bông điên điển / bông súng)
  const regrowMaxTicks = Math.round((meta.regrow_s || 20) * 60);
  for (const n of snap.nodes || []) {
    const nx = sx(n.pos[0]), ny = sy(n.pos[1]);
    const ready = n.ready !== false;
    const km = kindMeta(n.kind);
    const isTarget = hint && hint.type === "node" && hint.id === n.id;

    if (isTarget) {
      ctx.strokeStyle = "#ffd54f";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(nx, ny, 1.45 * s, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.save();
    ctx.globalAlpha = ready ? 1 : 0.35;
    if (!sprite(n.kind, nx, ny - 0.45 * s, 1.8 * s)) {
      // Lá nổi xanh
      ctx.fillStyle = "#3f8c4d";
      ctx.beginPath();
      ctx.ellipse(nx, ny + 0.1 * s, 1.15 * s, 0.35 * s, 0, 0, Math.PI * 2);
      ctx.fill();

      if (n.kind === "bong_dien_dien") {
        // Cành bông điên điển vàng rực
        ctx.strokeStyle = "#2e7d32";
        ctx.lineWidth = Math.max(1.5, 0.15 * s);
        ctx.beginPath();
        ctx.moveTo(nx, ny);
        ctx.quadraticCurveTo(nx - 0.3 * s, ny - 0.9 * s, nx + 0.2 * s, ny - 1.3 * s);
        ctx.stroke();
        ctx.fillStyle = km.color;
        for (const [dx, dy] of [[-0.35, -0.75], [0.25, -0.95], [-0.05, -1.25], [0.45, -0.55]]) {
          ctx.beginPath();
          ctx.arc(nx + dx * s, ny + dy * s, 0.3 * s, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (n.kind === "bong_sung") {
        // Hoa bông súng hồng nổi
        ctx.fillStyle = km.color;
        for (let a = -2; a <= 2; a++) {
          ctx.beginPath();
          ctx.ellipse(nx + a * 0.22 * s, ny - 0.45 * s, 0.24 * s, 0.5 * s, a * 0.25, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = "#fff176";
        ctx.beginPath();
        ctx.arc(nx, ny - 0.38 * s, 0.2 * s, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // Bụi rau nổi (kèo nèo / rau muống / mở rộng)
        ctx.fillStyle = km.color;
        for (const [dx, dy, rot] of [[-0.45, -0.55, -0.45], [0, -0.75, 0], [0.45, -0.55, 0.45]]) {
          ctx.beginPath();
          ctx.ellipse(nx + dx * s, ny + dy * s, 0.28 * s, 0.62 * s, rot, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    ctx.restore();

    drawText(`${n.id} · ${km.short}`, nx, ny - 1.65 * s, { size: 10, bold: true, align: "center", color: "#193342" });
    if (!ready && n.regrow_ticks > 0) {
      const frac = 1 - Math.min(1, n.regrow_ticks / Math.max(1, regrowMaxTicks));
      ctx.strokeStyle = "rgba(255,255,255,0.25)";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(nx, ny + 1.25 * s, 0.72 * s, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = "#a5d6a7";
      ctx.beginPath();
      ctx.arc(nx, ny + 1.25 * s, 0.72 * s, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
      ctx.stroke();
      drawText(Math.ceil(n.regrow_ticks / 60) + "s", nx, ny + 1.3 * s, { size: 9, bold: true, align: "center", base: "middle", color: "#fff" });
    }
  }

  // 5. Đàn cá dưới nước
  const yields = meta.fish_yield || { ca_linh: 3, ca_loc: 1 };
  for (const f of snap.fish || []) {
    const fx = sx(f.pos[0]), fy = sy(f.pos[1]);
    const km = kindMeta(f.kind);
    const isTarget = hint && hint.type === "fish" && hint.id === f.id;
    const wag = Math.sin(animTime * 6 + idHash(f.id)) * 0.16;

    if (isTarget) {
      ctx.strokeStyle = "#69f0ae";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(fx, fy, 1.55 * s, 0, Math.PI * 2);
      ctx.stroke();
    }

    const fAng = ((f.heading_deg || 0) * Math.PI) / 180;
    if (!sprite(f.kind, fx, fy, 2.3 * s, fAng, true)) {
      ctx.save();
      ctx.translate(fx, fy);
      ctx.rotate(fAng);

      if (f.kind === "ca_linh") {
        // Đàn 3 con cá linh bạc nhỏ bơi theo cụm
        for (const [oxf, oyf, sc] of [[0, -0.32, 0.72], [-0.45, 0.25, 0.65], [0.42, 0.22, 0.65]]) {
          ctx.save();
          ctx.translate(oxf * s, oyf * s);
          ctx.fillStyle = km.color;
          ctx.beginPath();
          ctx.ellipse(0, 0, 0.72 * sc * s, 0.3 * sc * s, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = km.accent;
          ctx.beginPath();
          ctx.moveTo(-0.62 * sc * s, 0);
          ctx.lineTo(-1.12 * sc * s, (-0.34 + wag) * sc * s);
          ctx.lineTo(-1.12 * sc * s, (0.34 + wag) * sc * s);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "#102027";
          ctx.beginPath();
          ctx.arc(0.36 * sc * s, -0.05 * sc * s, 0.08 * sc * s, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      } else {
        // Cá lóc / cá kèo / cá rô đồng
        ctx.fillStyle = km.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, 1.15 * s, 0.44 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        if (f.kind === "ca_loc") {
          ctx.fillStyle = "#4d6b30";
          for (const sxp of [-0.45, -0.1, 0.25]) {
            ctx.beginPath();
            ctx.ellipse(sxp * s, -0.12 * s, 0.14 * s, 0.26 * s, 0.25, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.fillStyle = km.color;
        ctx.beginPath();
        ctx.moveTo(-1.0 * s, 0);
        ctx.lineTo(-1.62 * s, (-0.42 + wag) * s);
        ctx.lineTo(-1.62 * s, (0.42 + wag) * s);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(0.68 * s, -0.1 * s, 0.13 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#111";
        ctx.beginPath();
        ctx.arc(0.72 * s, -0.1 * s, 0.07 * s, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    const yld = yields[f.kind];
    drawText(`${f.id} ${km.short}${yld ? " ×" + yld : ""}`, fx, fy - 0.95 * s, {
      size: 10, bold: isTarget, align: "center", color: isTarget ? "#b9f6ca" : "rgba(235,248,255,0.85)", shadow: true
    });
  }

  // 6. Hiệu ứng bọt nước trang trí khi Út Sen dưới nước
  const p = snap.player;
  if (p && p.pos) {
    const underwater = p.at_surface === undefined ? p.pos[1] > surfD : !p.at_surface;
    if (underwater && !snap.finished && Math.random() < dt * 7) {
      bubbles.push({ x: p.pos[0] + (Math.random() - 0.5) * 0.6, d: p.pos[1], r: 0.12 + Math.random() * 0.14 });
      if (bubbles.length > 24) bubbles.shift();
    }
  }
  ctx.strokeStyle = "rgba(225, 245, 254, 0.55)";
  ctx.lineWidth = 1;
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const bb = bubbles[i];
    bb.d -= dt * 3.2;
    bb.x += Math.sin(animTime * 4 + i) * dt * 0.3;
    if (bb.d <= 0) { bubbles.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.arc(sx(bb.x), sy(bb.d), bb.r * s, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 7. Nhân vật Út Sen
  if (p && p.pos) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > surfD : !p.at_surface;
    const cd = p.catch_cd_ticks || 0;
    const cdMax = Math.round((meta.catch_cooldown_s || 0.5) * 60);

    // Vòng bán kính tương tác / bắt cá
    if (underwater && meta.catch_radius) {
      ctx.strokeStyle = cd > 0 ? "rgba(255,255,255,0.16)" : (hint && hint.type === "fish" ? "rgba(105,240,174,0.75)" : "rgba(255,255,255,0.28)");
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    } else if (!underwater && meta.interact_radius) {
      ctx.strokeStyle = hint ? "rgba(255,213,79,0.75)" : "rgba(255,255,255,0.38)";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Vòng cảnh báo ngạt quanh người chơi
    if ((p.zero_oxy_ticks || 0) > 0) {
      const chokeFrac = Math.min(1, p.zero_oxy_ticks / (meta.choke_interval_ticks || 60));
      ctx.strokeStyle = "#ff5252";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(px, py, 1.15 * s, -Math.PI / 2, -Math.PI / 2 + chokeFrac * Math.PI * 2);
      ctx.stroke();
    }

    // Vẽ Út Sen (ưu tiên animation bơi ut-sen-swim.png khi di chuyển, rồi atlas, rồi fallback)
    if (!((p.invuln_ticks || 0) > 0 && Math.floor((snap.tick || 0) / 5) % 2)) {
      const ang = ((p.heading_deg || 0) * Math.PI) / 180;
      const facingLeft = Math.cos(ang) < 0;
      const drawAngle = facingLeft ? ang - Math.PI : ang;
      const moving = !snap.finished && p.vel && Math.hypot(...p.vel) > 0;
      const frame = Math.floor((snap.tick || 0) / 6) % 6;
      const region = [(frame % 2) * 512, Math.floor(frame / 2) * 512 + 100, 512, 330];
      const animated = moving && drawSprite(swimSheet, region, px, py, 3.4 * s, drawAngle, facingLeft);
      if (!animated && !sprite("swim", px, py, 2.8 * s, drawAngle, facingLeft)) {
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(ang);
        // Thân áo bà ba cam đất
        ctx.fillStyle = "#ff8a3d";
        ctx.beginPath();
        ctx.ellipse(0, 0, 0.85 * s, 0.52 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#3e2723";
        ctx.lineWidth = 1.2;
        ctx.stroke();
        // Khăn rằn nhỏ
        ctx.fillStyle = "#fff8e1";
        ctx.fillRect(-0.15 * s, -0.45 * s, 0.22 * s, 0.9 * s);
        // Đầu & kính lặn / mũi hướng
        ctx.fillStyle = "#ffe0b2";
        ctx.beginPath();
        ctx.arc(0.55 * s, 0, 0.34 * s, 0, Math.PI * 2);
        ctx.fill();
        if (underwater) {
          ctx.fillStyle = "#4fc3f7";
          ctx.fillRect(0.66 * s, -0.22 * s, 0.16 * s, 0.44 * s);
        }
        ctx.restore();

        // Nón lá khi nổi ở mặt nước
        if (!underwater) {
          ctx.fillStyle = "#f2d388";
          ctx.strokeStyle = "#8d6e4b";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(px - 0.9 * s, py - 0.45 * s);
          ctx.lineTo(px, py - 1.25 * s);
          ctx.lineTo(px + 0.9 * s, py - 0.45 * s);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
      }
    }

    // Cung hồi chiêu bắt cá cạnh người chơi
    if (cd > 0 && cdMax > 0) {
      const frac = 1 - Math.min(1, cd / cdMax);
      ctx.strokeStyle = "#ffa726";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(px, py, 1.05 * s, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
      ctx.stroke();
    }

    // Gợi ý phím hành động ngay trên mục tiêu hợp lệ
    if (hint && !snap.finished) {
      const hx = sx(hint.pos[0]), hy = sy(hint.pos[1]) - 2.3 * s;
      drawPillLabel(hint.label, hx, Math.max(top + 16, hy), "rgba(18,32,44,0.92)", "#ffe082", "#ffd54f", 11);
    }

    // Hiệu ứng đỏ viền màn hình khi cạn oxy
    if ((p.oxygen_ticks ?? 1) <= 0 && underwater) {
      const alpha = 0.16 + 0.12 * Math.sin(animTime * 8);
      const vg = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.25, w / 2, h / 2, Math.max(w, h) * 0.65);
      vg.addColorStop(0, "rgba(239, 83, 80, 0)");
      vg.addColorStop(1, `rgba(239, 83, 80, ${alpha.toFixed(3)})`);
      ctx.fillStyle = vg;
      ctx.fillRect(0, top, w, h - top - bottom);
    }
  }

  drawToasts(sx, sy);
}

// ---------- Vẽ cảnh QUÁN (nhìn từ trên xuống: x sang phải, z lên trên) ----------
function drawQuan(w, h) {
  const { top, bottom } = getHudInsets();
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1];
  const padX = 48, padY = 26;
  const s = Math.max(12, Math.min((w - padX * 2) / X, (h - top - bottom - padY * 2) / Z));
  const ox = (w - s * X) / 2;
  const oy = top + (h - top - bottom - s * Z) / 2;
  const sx = (x) => ox + x * s;
  const sy = (z) => oy + (Z - z) * s;

  // 1. Nền sông ban đêm lấp lánh ánh đèn chợ nổi
  const riverGrad = ctx.createRadialGradient(w / 2, (top + h - bottom) / 2, s * 2, w / 2, (top + h - bottom) / 2, Math.max(w, h) * 0.7);
  riverGrad.addColorStop(0, "#133145");
  riverGrad.addColorStop(1, "#08141f");
  ctx.fillStyle = riverGrad;
  ctx.fillRect(0, top, w, h - top - bottom);

  // Sóng lấp lánh quanh bè quán
  ctx.strokeStyle = "rgba(246, 189, 96, 0.14)";
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 12; i++) {
    const rx = ((i * 173) % w);
    const ry = top + 20 + ((i * 97) % Math.max(40, h - top - bottom - 40));
    const len = 18 + Math.sin(animTime * 2 + i) * 7;
    ctx.beginPath();
    ctx.moveTo(rx, ry);
    ctx.lineTo(rx + len, ry);
    ctx.stroke();
  }

  // 2. Sàn bè gỗ Quán Ăn Chợ Nổi
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.55)";
  ctx.shadowBlur = 24;
  roundRectPath(sx(0), sy(Z), X * s, Z * s, 10);
  ctx.fillStyle = "#b5854b";
  ctx.fill();
  ctx.restore();

  // Vân ván gỗ ngang
  ctx.save();
  roundRectPath(sx(0), sy(Z), X * s, Z * s, 10);
  ctx.clip();
  for (let z = 0; z < Z; z += 1) {
    ctx.fillStyle = z % 2 === 0 ? "rgba(92, 58, 25, 0.12)" : "rgba(255, 232, 185, 0.06)";
    ctx.fillRect(sx(0), sy(z + 1), X * s, s);
    ctx.strokeStyle = "rgba(62, 39, 18, 0.18)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sx(0), sy(z));
    ctx.lineTo(sx(X), sy(z));
    ctx.stroke();
  }
  // Khu vực bếp lát gạch ấm nhẹ ở góc trên trái
  ctx.fillStyle = "rgba(65, 42, 26, 0.22)";
  ctx.fillRect(sx(0), sy(Z), 5.2 * s, 4 * s);
  ctx.restore();

  // Lan can tre viền bè
  roundRectPath(sx(0), sy(Z), X * s, Z * s, 10);
  ctx.strokeStyle = "#5c3b1e";
  ctx.lineWidth = 5;
  ctx.stroke();
  roundRectPath(sx(0), sy(Z), X * s, Z * s, 10);
  ctx.strokeStyle = "#d4a66a";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Dây đèn lồng trang trí mép trên bè
  for (let x = 1; x < X; x += 2.5) {
    const lx = sx(x), ly = sy(Z) + 2;
    const warm = Math.floor(x) % 2 === 0 ? "#ffd54f" : "#ff8a65";
    const glow = ctx.createRadialGradient(lx, ly, 1, lx, ly, 0.85 * s);
    glow.addColorStop(0, warm);
    glow.addColorStop(1, "rgba(255, 213, 79, 0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(lx, ly, 0.85 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = warm;
    ctx.beginPath();
    ctx.arc(lx, ly, 0.18 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  const hint = getQuanHintTarget();
  const handDish = extractDishId(snap.hand);

  // 3. Bếp (Stoves)
  for (const st of snap.stoves || []) {
    const x = sx(st.pos[0]), y = sy(st.pos[1]);
    const stDish = extractDishId(st.dish || st.dish_id);
    const stInfo = stDish ? dishMeta(stDish) : null;
    const isTarget = hint && hint.kind === "stove" && hint.id === st.id;

    // Vòng sáng khi sẵn sàng hoặc trong tầm tương tác
    if (st.state === "ready") {
      const pulseR = (1.15 + Math.sin(animTime * 5) * 0.1) * s;
      ctx.fillStyle = "rgba(102, 187, 106, 0.25)";
      ctx.beginPath();
      ctx.arc(x, y, pulseR, 0, Math.PI * 2);
      ctx.fill();
    }
    if (isTarget) {
      ctx.strokeStyle = "#ffd54f";
      ctx.lineWidth = 2.5;
      roundRectPath(x - 1.02 * s, y - 1.02 * s, 2.04 * s, 2.04 * s, 10);
      ctx.stroke();
    }

    // Thân bếp (ưu tiên sprite atlas nếu có)
    if (!sprite("stove", x, y, 1.7 * s)) {
      const col = st.state === "cooking" ? "#d97828" : st.state === "ready" ? "#56a852" : st.state === "burned" ? "#424242" : "#5e646c";
      roundRectPath(x - 0.85 * s, y - 0.85 * s, 1.7 * s, 1.7 * s, 8);
      ctx.fillStyle = col;
      ctx.fill();
      ctx.strokeStyle = "#241911";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Nồi / mặt bếp tròn
      ctx.fillStyle = st.state === "cooking" ? "#ff9800" : "#2f3338";
      ctx.beginPath();
      ctx.arc(x, y, 0.54 * s, 0, Math.PI * 2);
      ctx.fill();
      if (st.state === "cooking") {
        // Lửa rực nhẹ
        ctx.fillStyle = `rgba(255, 235, 59, ${(0.6 + Math.sin(animTime * 14) * 0.25).toFixed(2)})`;
        ctx.beginPath();
        ctx.arc(x, y, 0.34 * s, 0, Math.PI * 2);
        ctx.fill();
      } else if (st.state === "ready") {
        ctx.fillStyle = stInfo ? stInfo.color : "#81c784";
        ctx.beginPath();
        ctx.arc(x, y, 0.4 * s, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    drawText(st.id, x, y + 1, { size: 12, bold: true, align: "center", base: "middle", color: "#fff", shadow: true });

    // Nhãn món & thanh tiến độ nấu
    if (stInfo) {
      if (!sprite(stDish, x, y - 1.15 * s, 0.85 * s)) {
        drawPillLabel(`${stInfo.icon} ${stInfo.short}`, x, y - 1.15 * s, "rgba(22,16,10,0.86)", "#ffe8b8", stInfo.color, 10);
      } else {
        drawPillLabel(stInfo.short, x, y - 1.65 * s, "rgba(22,16,10,0.82)", "#ffe8b8", stInfo.color, 9);
      }
    } else {
      drawText("Bếp trống", x, y - 1.05 * s, { size: 10, align: "center", color: "#3d2410" });
    }

    if (st.state === "cooking" && st.cook_ticks_left !== undefined) {
      const total = st.cook_ticks_total || ((stInfo && stInfo.cook_s ? stInfo.cook_s : 6) * 60);
      const frac = 1 - Math.min(1, st.cook_ticks_left / Math.max(1, total));
      drawBar(x - 0.9 * s, y + 0.98 * s, 1.8 * s, 7, frac, "#ffa726");
      drawText(`${(st.cook_ticks_left / 60).toFixed(1)}s`, x, y + 1.48 * s, { size: 10, bold: true, align: "center", color: "#fff", shadow: true });
    } else if (st.state === "ready") {
      const rSec = st.ready_ticks > 0 ? ` ${Math.floor(st.ready_ticks / 60)}s` : "";
      drawPillLabel(`CHÍN!${rSec} [E]`, x, y + 1.18 * s, "rgba(46,125,50,0.94)", "#fff", "#a5d6a7", 10);
    } else if (st.state === "burned") {
      drawPillLabel("CHÁY!", x, y + 1.18 * s, "rgba(183,28,28,0.92)", "#ffcdd2", "#ef5350", 10);
    }
  }

  // 4. Bàn & Khách (Tables & Customers)
  const patMaxDefault = (meta.patience_s || 60) * 60;
  const eatMaxDefault = (meta.eat_s || 10) * 60;
  const tipRatio = meta.tip_min_patience_ratio ?? 0.5;
  const byTable = {};
  const byCustomerId = {};
  for (const c of snap.customers || []) {
    if (c.table_id) byTable[c.table_id] = c;
    if (c.id) byCustomerId[c.id] = c;
  }

  for (const tb of snap.tables || []) {
    const x = sx(tb.pos[0]), y = sy(tb.pos[1]);
    const c = byTable[tb.id] || (tb.customer_id ? byCustomerId[tb.customer_id] : null);
    const isTarget = hint && hint.kind === "table" && hint.id === tb.id;

    if (isTarget) {
      ctx.strokeStyle = "#ffd54f";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(x, y, 1.15 * s, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Ghế đẩu quanh bàn
    ctx.fillStyle = "#6d4420";
    ctx.beginPath();
    ctx.arc(x, y - 1.25 * s, 0.34 * s, 0, Math.PI * 2);
    ctx.fill();

    // Mặt bàn gỗ tròn (ưu tiên sprite atlas nếu có)
    if (!sprite("table", x, y, 1.85 * s)) {
      ctx.fillStyle = "#7c4c22";
      ctx.beginPath();
      ctx.arc(x, y, 0.92 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#47290f";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    drawText(tb.id, x, y + 1, { size: 12, bold: true, align: "center", base: "middle", color: "#ffe8c2" });

    // Khách ngồi tại bàn
    if (c) {
      const cx = x, cy = y - 1.48 * s;
      const dishId = extractDishId(c.dish_id || c.dish || c.order);
      const dInfo = dishId ? dishMeta(dishId) : null;
      const isEating = c.state === "eating";
      const custCol = isEating ? "#66bb6a" : CUSTOMER_COLORS[idHash(c.id) % CUSTOMER_COLORS.length];

      // Thân khách
      ctx.fillStyle = custCol;
      ctx.beginPath();
      ctx.arc(cx, cy, 0.56 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#2b1b12";
      ctx.lineWidth = 1.6;
      ctx.stroke();
      drawText(c.id || "C", cx, cy + 1, { size: 10, bold: true, align: "center", base: "middle", color: "#1b120b" });

      if (isEating) {
        // Đĩa món trên bàn
        ctx.fillStyle = "#fff8e1";
        ctx.beginPath();
        ctx.arc(x, y - 0.32 * s, 0.34 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = dInfo ? dInfo.color : "#ffb74d";
        ctx.beginPath();
        ctx.arc(x, y - 0.32 * s, 0.22 * s, 0, Math.PI * 2);
        ctx.fill();

        const eatLeft = c.eat_ticks_left ?? c.eat_ticks;
        const eatMax = c.eat_max_ticks || eatMaxDefault;
        drawPillLabel(`😋 Đang ăn${eatLeft !== undefined ? " " + Math.ceil(eatLeft / 60) + "s" : ""}`, cx, cy - 0.98 * s, "rgba(27,94,32,0.9)", "#e8f5e9", "#81c784", 10);
        if (eatLeft !== undefined) {
          drawBar(cx - 0.9 * s, cy + 0.66 * s, 1.8 * s, 6, 1 - Math.min(1, eatLeft / Math.max(1, eatMax)), "#66bb6a");
        }
      } else {
        // Bong bóng gọi món & thanh kiên nhẫn + mốc boa (tip_min_patience_ratio)
        const patLeft = c.patience_ticks_left ?? c.patience_ticks;
        const patMax = c.patience_max_ticks || patMaxDefault;
        const frac = patLeft !== undefined ? Math.max(0, Math.min(1, patLeft / Math.max(1, patMax))) : 1;
        const barCol = frac >= tipRatio ? "#66bb6a" : frac >= 0.25 ? "#ffa726" : "#ef5350";
        const willTip = frac >= tipRatio;

        const orderTxt = dInfo ? `${dInfo.icon} ${dInfo.short}${willTip ? " ★" : ""}` : "Đang gọi…";
        if (dishId && sprite(dishId, cx, cy - 1.05 * s, 0.8 * s)) {
          drawPillLabel(orderTxt, cx, cy - 1.6 * s, "rgba(255,250,240,0.95)", "#2c1a0e", barCol, 9);
        } else {
          drawPillLabel(orderTxt, cx, cy - 1.02 * s, "rgba(255,250,240,0.95)", "#2c1a0e", barCol, 10);
        }

        if (patLeft !== undefined) {
          drawBar(cx - 0.95 * s, cy + 0.66 * s, 1.9 * s, 7, frac, barCol, tipRatio);
          drawText(`${Math.ceil(patLeft / 60)}s`, cx + 1.15 * s, cy + 0.72 * s, {
            size: 10, bold: true, align: "left", base: "middle", color: frac < 0.25 ? "#ff8a80" : "#fff", shadow: true
          });
        }
      }
    }
  }

  // 5. Nhân vật Út Sen (đứng quán)
  const p = snap.player;
  if (p && p.pos) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) {
      ctx.strokeStyle = hint ? "rgba(255, 213, 79, 0.7)" : "rgba(255, 255, 255, 0.35)";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Bóng nhân vật
    ctx.fillStyle = "rgba(0,0,0,0.28)";
    ctx.beginPath();
    ctx.ellipse(px, py + 0.35 * s, 0.55 * s, 0.28 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    // Út Sen nhìn từ trên xuống: ưu tiên sprite atlas nếu có, fallback áo bà ba + nón lá
    if (!sprite("serve", px, py, 1.4 * s)) {
      ctx.fillStyle = "#ff8a3d";
      ctx.beginPath();
      ctx.arc(px, py, 0.54 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#3e2723";
      ctx.lineWidth = 1.6;
      ctx.stroke();
      // Nón lá nhìn từ trên xuống
      ctx.fillStyle = "#f2d388";
      ctx.beginPath();
      ctx.arc(px, py, 0.38 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#9e7b47";
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = "#c99f54";
      ctx.beginPath();
      ctx.arc(px, py, 0.09 * s, 0, Math.PI * 2);
      ctx.fill();
    }

    // Mâm món đang bưng trên tay
    if (handDish) {
      const hi = dishMeta(handDish);
      if (sprite(handDish, px, py - 0.9 * s, 0.72 * s)) {
        drawPillLabel(hi.short, px, py - 1.4 * s, "rgba(246,189,96,0.95)", "#241406", "#fff3e0", 10);
      } else {
        drawPillLabel(`${hi.icon} ${hi.short}`, px, py - 0.92 * s, "rgba(246,189,96,0.95)", "#241406", "#fff3e0", 11);
      }
    }

    // Gợi ý hành động [E] trên mục tiêu ưu tiên gần nhất
    if (hint && !snap.finished) {
      let actionLabel = "[E] Tương tác";
      if (hint.kind === "stove") {
        if (hint.obj.state === "ready" && !handDish) actionLabel = "[E] Bưng món";
        else if (hint.obj.state === "idle") actionLabel = "[E] Nấu";
        else actionLabel = `[E] Bếp ${hint.id}`;
      } else {
        const cust = byTable[hint.id];
        if (cust && handDish) actionLabel = "[E] Phục vụ";
        else actionLabel = `[E] Bàn ${hint.id}`;
      }
      drawPillLabel(actionLabel, sx(hint.obj.pos[0]), sy(hint.obj.pos[1]) + 1.55 * s, "rgba(18,32,44,0.92)", "#ffe082", "#ffd54f", 10);
    }
  }

  drawToasts(sx, sy);
}

// ---------- Vẽ popup sự kiện nổi ----------
function drawToasts(sx, sy) {
  const now = performance.now();
  const lifetime = 2100;
  for (let i = toasts.length - 1; i >= 0; i--) {
    const t = toasts[i];
    const age = now - t.bornMs;
    if (age > lifetime) { toasts.splice(i, 1); continue; }
    const alpha = age > lifetime - 500 ? (lifetime - age) / 500 : 1;
    const tx = t.worldPos ? sx(t.worldPos[0]) : innerWidth / 2;
    const ty = (t.worldPos ? sy(t.worldPos[1]) : innerHeight / 2) - 28 - (age / lifetime) * 42 - (toasts.length - 1 - i) * 16;
    ctx.save();
    ctx.globalAlpha = Math.max(0, alpha);
    drawPillLabel(t.text, Math.max(90, Math.min(innerWidth - 90, tx)), Math.max(76, ty), "rgba(10,20,29,0.88)", t.color, t.color, 11);
    ctx.restore();
  }
}

// ---------- Vòng vẽ chính ----------
function frame(now) {
  requestAnimationFrame(frame); // đặt trước để lỗi vẽ không dừng vòng lặp
  const dt = Math.min(0.05, Math.max(0, (now - lastFrameMs) / 1000));
  lastFrameMs = now;
  animTime += dt;

  const [w, h] = fit();
  ctx.fillStyle = "#0c1821";
  ctx.fillRect(0, 0, w, h);

  if (snap) {
    if (snap.mode === "quan") drawQuan(w, h);
    else drawGather(w, h, dt);
  } else {
    drawText(offline ? "Không kết nối được máy chủ…" : "Đang kết nối tới Quán Ăn Chợ Nổi…", w / 2, h / 2, {
      align: "center", base: "middle", size: 17, color: "#cfd8dc"
    });
  }
}
requestAnimationFrame(frame);
</script>
